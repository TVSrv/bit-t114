# На машине сборки всего 3 ГБ памяти, поэтому демонам Gradle и Kotlin выделен скромный heap,
# а параллельная сборка модулей выключена: модуль всё равно один.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1280m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
