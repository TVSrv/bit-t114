name: Verify real pixel screenshots (0.43 rich weather)

on:
  push:
    branches: ['experiment/pet-clock-weather-screen', 'experiment/rich-weather-dashboard-0.43']
    paths:
      - sim/docs_shots.cpp
      - 'core/**'
      - .github/workflows/real-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout renderer from branch
        uses: actions/checkout@v4
      - name: Build native renderer
        run: |
          g++ -O2 -std=c++17 -o /tmp/bit-real-shots sim/docs_shots.cpp core/*.cpp
          mkdir -p /tmp/bit-ppm docs/screenshots
          /tmp/bit-real-shots /tmp/bit-ppm
      - name: Convert exact game frames to lossless PNG
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("/tmp/bit-ppm")
          target = Path("docs/screenshots")
          names = []
          for ppm in sorted(source.glob("*.ppm")):
              image = Image.open(ppm).convert("RGB")
              assert image.size == (240, 135), (ppm.name, image.size)
              image.resize((720, 405), Image.Resampling.NEAREST).save(
                  target / (ppm.stem + ".png"), format="PNG", optimize=True
              )
              names.append(ppm.stem)
          assert len(names) == 48, names
          print("Accurate images rendered from source:", names)
          PY
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: Bit-0.43-rich-weather-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Publish two new verified screenshots to the experimental branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Pixel screenshots unchanged"
          else
            git commit -m "docs(ui): add authentic screenshots of wake dashboard and pet"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
