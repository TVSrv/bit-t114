; Прошивка тамагочи «Бит» для Heltec Mesh Node T114 (nRF52840, экран ST7789 240x135, GPS L76K)
[platformio]
src_dir = firmware/src
boards_dir = firmware/boards
default_envs = t114

[env:t114]
platform = nordicnrf52@10.6.0
framework = arduino
board = heltec_t114
board_build.variants_dir = firmware/variants
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Icore -DCFG_DEBUG=0
  ; из RadioLib нужен только SX1262 — остальное не собирать (прошивка меньше, обновление по воздуху быстрее)
  -DRADIOLIB_EXCLUDE_CC1101 -DRADIOLIB_EXCLUDE_NRF24 -DRADIOLIB_EXCLUDE_RF69 -DRADIOLIB_EXCLUDE_SX1231
  -DRADIOLIB_EXCLUDE_SI443X -DRADIOLIB_EXCLUDE_RFM2X -DRADIOLIB_EXCLUDE_SX127X -DRADIOLIB_EXCLUDE_STM32WLX
  -DRADIOLIB_EXCLUDE_SX128X -DRADIOLIB_EXCLUDE_AFSK -DRADIOLIB_EXCLUDE_AX25 -DRADIOLIB_EXCLUDE_HELLSCHREIBER
  -DRADIOLIB_EXCLUDE_MORSE -DRADIOLIB_EXCLUDE_RTTY -DRADIOLIB_EXCLUDE_SSTV -DRADIOLIB_EXCLUDE_APRS
  -DRADIOLIB_EXCLUDE_BELL -DRADIOLIB_EXCLUDE_FSK4 -DRADIOLIB_EXCLUDE_PAGER -DRADIOLIB_EXCLUDE_LORAWAN
  -DRADIOLIB_EXCLUDE_LR11X0
build_src_filter = +<*> +<../../core/>
lib_deps =
  adafruit/Adafruit NeoPixel@1.12.3
  jgromes/RadioLib@7.1.2
upload_protocol = nrfutil
monitor_speed = 115200
extra_scripts = post:tools/uf2.py
